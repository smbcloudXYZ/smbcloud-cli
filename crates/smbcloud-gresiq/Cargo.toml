[package]
name = "smbcloud-gresiq"
description = "GresIQ is serverless PostgreSQL on smbCloud. This crate is a placeholder while the Rust client takes shape; use smbcloud-gresiq-sdk today."
version = "1.2.4"
edition = "2024"
readme = "README.md"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "gresiq", "postgres", "serverless", "database"]
categories = ["database", "development-tools", "api-bindings"]

[lib]
path = "src/gresiq.rs"

[dependencies]
native-tls = "0.2"
postgres-native-tls = "0.5"
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { workspace = true }
