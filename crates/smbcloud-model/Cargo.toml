[package]
name = "smbcloud-model"
version = "1.2.3"
edition = "2021"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "Shared data models for the smbCloud CLI and SDKs: projects, deployments, accounts and error types."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "models", "serde", "api", "cloud"]
categories = ["development-tools", "api-bindings", "data-structures"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_repr = { workspace = true }
spinners = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tsync = { workspace = true }
