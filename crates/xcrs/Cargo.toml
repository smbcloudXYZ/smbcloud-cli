[package]
name = "xcrs"
version = "0.4.13"
edition = "2021"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "Cross-platform mobile and TV app automation over MCP."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
documentation = "https://smbcloud.xyz/posts"
keywords = ["mcp", "mobile", "android", "ios", "automation"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/xcrs.rs"

[[bin]]
name = "xcrs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
