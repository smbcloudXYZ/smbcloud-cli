[package]
name = "smbcloud-auth"
version = "1.2.3"
edition = "2024"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "smbCloud Auth for Rust: signup, login, logout, OAuth and account management against the smbCloud Auth service."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "auth", "authentication", "oauth", "login"]
categories = ["authentication", "api-bindings", "web-programming"]
readme = "README.md"

[dependencies]
log = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smbcloud-model = { workspace = true }
smbcloud-network = { workspace = true }
smbcloud-networking = { workspace = true }
url-builder = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }
