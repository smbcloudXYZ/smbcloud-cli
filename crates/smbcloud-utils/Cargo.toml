[package]
name = "smbcloud-utils"
version = "1.2.5"
edition = "2021"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "Shared helpers for smbCloud crates: smbCloud config file handling and input validation."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "utils", "config", "cli", "cloud"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
home = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smbcloud-model = { workspace = true }
toml = { workspace = true }
