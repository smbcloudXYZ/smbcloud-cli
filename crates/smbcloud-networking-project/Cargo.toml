[package]
name = "smbcloud-networking-project"
version = "1.2.5"
edition = "2021"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "smbCloud project and deployment API client: create, read, update and delete projects, apps and deploy configs."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "deploy", "project", "api-client", "cloud"]
categories = ["development-tools", "api-bindings", "web-programming::http-client"]
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
dirs = { workspace = true }
log = { workspace = true }
maybe-async = { workspace = true, features = ["is_sync"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smbcloud-model = { workspace = true }
smbcloud-network = { workspace = true }
smbcloud-networking = { workspace = true }
thiserror = { workspace = true }
