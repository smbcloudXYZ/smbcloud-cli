[package]
name = "smbcloud-network"
version = "1.2.3"
edition = "2024"
readme = "README.md"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "HTTP plumbing for smbCloud clients: API environments, base URLs and error mapping."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "http", "api-client", "environment", "cloud"]
categories = ["development-tools", "api-bindings", "network-programming", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smbcloud-model = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
