[package]
name = "smbcloud-networking"
version = "1.2.4"
edition = "2021"
readme = "README.md"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "Low-level HTTP client helpers for smbCloud services: URL building and client credentials."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "http", "api-client", "networking", "cloud"]
categories = ["development-tools", "api-bindings", "network-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smbcloud-network = { workspace = true }
url-builder = { workspace = true }
