[package]
name = "smbcloud-auth-sdk-wasm"
version = "1.2.1"
edition = "2024"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
description = "Browser bindings for smbCloud Auth: signup, login, profile lookup and logout from WebAssembly."
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-cli"
homepage = "https://smbcloud.xyz"
documentation = "https://smbcloud.xyz/posts"
keywords = ["smbcloud", "auth", "wasm", "webassembly", "authentication"]
categories = ["authentication", "wasm", "web-programming"]
readme = "README.md"

[lib]
# Pin the lib name so wasm-pack artifact filenames (smbcloud_auth_wasm.js etc.)
# remain stable regardless of the crate/directory rename.
name = "smbcloud_auth_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde-wasm-bindgen = "=0.6.5"
smbcloud-auth-sdk = { workspace = true }
smbcloud-network = { workspace = true }
smbcloud-networking = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.50"

# uuid's v4 feature needs a randomness source on wasm32-unknown-unknown.
# The `js` feature wires it to the Web Crypto API (crypto.getRandomValues).
# This only activates when building for wasm32 targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
