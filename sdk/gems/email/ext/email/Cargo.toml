[package]
name = "email"
version = "1.0.0"
edition = "2024"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# The published transactional-email SDK. For local development this is patched
# to the in-repo crate via `[patch.crates-io]` in the gem workspace Cargo.toml.
smbcloud-email-sdk = { version = "1.0" }
