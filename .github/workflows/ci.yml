name: Tests

# One run per commit: push only for the integration branches, pull_request for
# everything else (tag pushes are covered by the release workflows). Files that
# never affect a job skip the workflow entirely; the `changes` job then routes
# the rest so each job runs only when its own inputs changed. Editing ci.yml
# re-runs everything. Covers:
#   - All Rust workspace members (fmt, clippy, tests)
#   - smbcloud-cli + xcrs clippy on Windows and macOS (cfg-gated code)
#   - smbcloud-auth-sdk-wasm (wasm32-unknown-unknown cargo check)
#   - sdk/python  → maturin wheel build  (smbcloud-sdk-auth)
#   - sdk/npm     → wasm-pack + prepare-package.mjs  (@smbcloud/sdk-auth)
#   - sdk/gems    → smbcloud-auth, smbcloud-model and smbcloud-email, cross-built for
#                   x86_64-linux, aarch64-linux, arm64-darwin and x86_64-darwin
#                   against the workspace crates (oldest and newest shipped
#                   Ruby), then installed and required on native runners; the
#                   source gem is built, its file list checked and installed
#   - nuget       → .NET tool launcher build         (SmbCloud.Cli)
#   - workflows   → actionlint (release workflows cannot run in CI)

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "docs/**"
  workflow_dispatch:

# A newer commit on a pull request cancels the run it supersedes. development
# and main are never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' && github.ref != 'refs/heads/main' }}

env:
  CLI_CLIENT_SECRET: ${{ secrets.CLI_CLIENT_SECRET }}
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes — route jobs by changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      npm_sdk: ${{ steps.filter.outputs.npm_sdk }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      nuget: ${{ steps.filter.outputs.nuget }}
      gems: ${{ steps.filter.outputs.gems }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            wasm:
              - "crates/smbcloud-auth-sdk-wasm/**"
              - "crates/smbcloud-auth-sdk/**"
              - "crates/smbcloud-model/**"
              - "crates/smbcloud-network/**"
              - "crates/smbcloud-networking/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            npm_sdk:
              - "crates/smbcloud-auth-sdk-wasm/**"
              - "sdk/npm/**"
              - ".nvmrc"
              - "crates/smbcloud-auth-sdk/**"
              - "crates/smbcloud-model/**"
              - "crates/smbcloud-network/**"
              - "crates/smbcloud-networking/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            python_sdk:
              - "crates/smbcloud-auth-sdk-py/**"
              - "sdk/python/**"
              - "crates/smbcloud-auth-sdk/**"
              - "crates/smbcloud-model/**"
              - "crates/smbcloud-network/**"
              - "crates/smbcloud-networking/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            nuget:
              - "packaging/nuget/**"
              - ".github/workflows/ci.yml"
            gems:
              - "sdk/gems/auth/**"
              - "sdk/gems/model/**"
              - "sdk/gems/email/**"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".ruby-version"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"

  # ── Rust workspace ──────────────────────────────────────────────────────────
  test-rust:
    name: Rust — fmt / clippy / test (workspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      # smbcloud-auth-sdk-wasm targets wasm32-unknown-unknown and cannot be
      # compiled or tested on the host. It is checked in its own job below.
      - name: Clippy — all workspace members (host targets)
        run: cargo clippy --workspace --exclude smbcloud-auth-sdk-wasm --tests -- -D warnings

      - name: Test — all workspace members (host targets)
        run: cargo test --workspace --exclude smbcloud-auth-sdk-wasm

  # ── Cross-platform build ────────────────────────────────────────────────────
  # Gated on `rust`, not just crates/cli: cfg(windows) code also lives in the
  # dependency crates, and this is the only job that compiles it on Windows.
  # A #[cfg(unix)] mismatch type-checks on Linux and only fails on Windows, so
  # compile the packages the release workflows build on those OSes.
  check-cross-platform:
    name: Rust — clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-cross-platform-${{ matrix.os }}

      - name: Clippy — smbcloud-cli and xcrs
        run: cargo clippy --locked --package smbcloud-cli --package xcrs --tests -- -D warnings

  # ── WASM crate ──────────────────────────────────────────────────────────────
  check-wasm:
    name: Rust — smbcloud-auth-sdk-wasm (wasm32-unknown-unknown)
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit with wasm32 target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-wasm

      - name: Check — smbcloud-auth-sdk-wasm
        run: cargo check --package smbcloud-auth-sdk-wasm --target wasm32-unknown-unknown

  # ── Python SDK ──────────────────────────────────────────────────────────────
  check-python-sdk:
    name: SDK — Python wheel (smbcloud-sdk-auth)
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-python-sdk

      # manylinux: 'off' runs natively on the ubuntu-latest runner without
      # spinning up a manylinux container, which is sufficient for a CI check.
      # OpenSSL is vendored in the workspace (features = ["vendored"]) so no
      # system libssl-dev is required.
      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sdk/python
          manylinux: "off"
          args: --release --locked --out dist

  # ── npm / WASM SDK ──────────────────────────────────────────────────────────
  check-npm-sdk:
    name: SDK — npm / WASM (@smbcloud/sdk-auth)
    needs: changes
    if: needs.changes.outputs.npm_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit with wasm32 target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-npm-sdk

      # wasm-pack orchestrates the wasm32 build and wasm-bindgen code generation.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # prepare-package.mjs runs wasm-pack internally and then assembles the
      # dist/ directory — this validates the full npm package pipeline.
      - name: Build and prepare package
        working-directory: sdk/npm/smbcloud-auth
        run: node ./prepare-package.mjs

  # ── .NET tool ───────────────────────────────────────────────────────────────
  check-nuget-tool:
    name: NuGet — .NET tool launcher (SmbCloud.Cli)
    needs: changes
    if: needs.changes.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build .NET tool launcher
        run: dotnet build packaging/nuget/smbcloud-cli/SmbCloud.Cli.csproj --configuration Release

  # ── Ruby Gems ───────────────────────────────────────────────────────────────
  # Cross-builds each gem like release-sdk-gem.yml, but against the workspace
  # crates (not the published ones) and only for the oldest and newest Ruby the
  # release ships. Those bracket the C-API differences.
  check-ruby-gems:
    name: SDK — ${{ matrix.gem }} gem (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.gems == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [auth, model, email]
        platform: [x86_64-linux, aarch64-linux, arm64-darwin, x86_64-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # CI validates the unreleased workspace version. Derive the local crate
      # patches from the extension manifest; release builds deliberately
      # resolve published crates after the release workflow has run. The
      # whole checkout is mounted into the rb-sys-dock container, so the
      # relative paths resolve there too. Cargo discovers .cargo/config.toml
      # from the current directory, not the manifest's, which is why the
      # lockfile is generated from inside the gem directory.
      - name: Use workspace Rust crates for the gem check
        shell: bash
        run: |
          mkdir -p sdk/gems/${{ matrix.gem }}/.cargo
          {
            echo "[patch.crates-io]"
            awk -F '=' '/^smbcloud-[[:alnum:]-]+[[:space:]]*=/ {
              name = $1
              gsub(/[[:space:]]/, "", name)
              print name " = { path = \"../../../crates/" name "\" }"
            }' sdk/gems/${{ matrix.gem }}/ext/${{ matrix.gem }}/Cargo.toml
          } > sdk/gems/${{ matrix.gem }}/.cargo/config.toml
          (cd sdk/gems/${{ matrix.gem }} && cargo generate-lockfile)

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: sdk/gems/${{ matrix.gem }}

      - name: Cross-compile native gem
        id: cross-gem
        uses: oxidize-rb/actions/cross-gem@v1
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.1,4.0"
          working-directory: sdk/gems/${{ matrix.gem }}
          cache-version: ci-${{ matrix.gem }}

      - name: Upload gem artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-gem-${{ matrix.gem }}-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          retention-days: 1

  # Install each prebuilt gem on a native runner and require it, which takes
  # the real load path (the per-Ruby lib/<gem>/<x.y>/ bundle first). Catches
  # load-time breakage such as a dyld-rejected install name.
  smoke-test-ruby-gems:
    name: Smoke — ${{ matrix.gem }} ${{ matrix.platform }} (Ruby ${{ matrix.ruby }})
    needs: check-ruby-gems
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        gem: [auth, model, email]
        ruby: ["3.1", "4.0"]
        platform: [x86_64-linux, aarch64-linux, arm64-darwin]
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: arm64-darwin
            runner: macos-latest
          - gem: auth
            constant: SmbCloud::Auth
          - gem: model
            constant: Model
          - gem: email
            constant: SmbCloud::Email
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Download gem artifact
        uses: actions/download-artifact@v7
        with:
          name: ci-gem-${{ matrix.gem }}-${{ matrix.platform }}
          path: gem

      - name: Install the gem
        shell: bash
        run: gem install gem/*.gem

      # No checkout in this job, so only the installed gem can satisfy the require.
      - name: Require the gem
        shell: bash
        run: ruby -e 'require "${{ matrix.gem }}"; puts ${{ matrix.constant }}'

  # Builds the source gem from git ls-files and installs it, compiling from
  # source once. Catches spec.files problems (symlinks, missing Cargo files)
  # that only surface on a user's machine.
  check-ruby-source-gems:
    name: SDK — ${{ matrix.gem }} source gem
    needs: changes
    if: needs.changes.outputs.gems == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [auth, model, email]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install toolkit
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # `gem install` compiles under $GEM_HOME, outside the checkout, so an
      # in-tree .cargo/config.toml is never found. $CARGO_HOME always is.
      - name: Use workspace Rust crates for the gem check
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          {
            echo "[patch.crates-io]"
            awk -F '=' -v root="$GITHUB_WORKSPACE" '/^smbcloud-[[:alnum:]-]+[[:space:]]*=/ {
              name = $1
              gsub(/[[:space:]]/, "", name)
              print name " = { path = \"" root "/crates/" name "\" }"
            }' sdk/gems/${{ matrix.gem }}/ext/${{ matrix.gem }}/Cargo.toml
          } >> "$cargo_home/config.toml"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: sdk/gems/${{ matrix.gem }}

      # `gem build`, not `rake build`: the latter depends on :compile.
      - name: Build the source gem
        working-directory: sdk/gems/${{ matrix.gem }}
        run: |
          mkdir -p pkg
          gem build ${{ matrix.gem }}.gemspec --output pkg/${{ matrix.gem }}-source.gem

      - name: Check the source gem file list
        working-directory: sdk/gems/${{ matrix.gem }}
        shell: bash
        run: |
          files="$(gem spec pkg/${{ matrix.gem }}-source.gem files | sed -n 's/^- //p')"
          echo "$files"
          fail=0
          require() {
            if ! grep -Eq "$1" <<<"$files"; then
              echo "::error::source gem is missing $2" >&2
              fail=1
            fi
          }
          require "^ext/${{ matrix.gem }}/extconf\.rb$" "ext/${{ matrix.gem }}/extconf.rb"
          require '^ext/.*\.rs$' "ext/**/*.rs"
          require '(^|/)Cargo\.toml$' "Cargo.toml"
          require '(^|/)Cargo\.lock$' "Cargo.lock"
          if grep -Eq '(^|/)(target|tmp)/' <<<"$files"; then
            echo "::error::source gem contains target/ or tmp/ paths" >&2
            fail=1
          fi
          while IFS= read -r f; do
            if [ -L "$f" ]; then
              echo "::error::source gem contains the symlink $f" >&2
              fail=1
            fi
          done <<<"$files"
          exit "$fail"

      - name: Install the source gem
        working-directory: sdk/gems/${{ matrix.gem }}
        run: gem install pkg/${{ matrix.gem }}-source.gem

  # CI cannot run a release workflow, so a lint is the check for those edits.
  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color

  # Passes when every job succeeded or was skipped, so a skipped job never
  # leaves it pending. Do not make it a required check while the workflow-level
  # paths-ignore is on pull_request: a PR touching only ignored files starts no
  # run, and a required check would wait for it forever. Drop paths-ignore from
  # pull_request first (the `changes` job then skips everything).
  ci:
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-rust
      - check-cross-platform
      - check-wasm
      - check-python-sdk
      - check-npm-sdk
      - check-nuget-tool
      - check-ruby-gems
      - smoke-test-ruby-gems
      - check-ruby-source-gems
      - actionlint
    if: always()
    steps:
      - name: Verify every job succeeded or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a needed job finished as $result"; exit 1 ;;
            esac
          done
